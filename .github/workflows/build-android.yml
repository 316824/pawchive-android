name: Build Pawchive Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache cmake libffi-dev libltdl-dev \
            libncurses-dev libssl-dev libtool pkg-config unzip zip zlib1g-dev

      - name: Install Qt for Python and Android build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.12.0

      - name: Download Android SDK and NDK
        run: |
          git clone --depth 1 --branch 6.12 https://code.qt.io/pyside/pyside-setup.git pyside-setup
          python -m pip install -r pyside-setup/tools/cross_compile_android/requirements.txt
          python pyside-setup/tools/cross_compile_android/main.py \
            --download-only --skip-update --auto-accept-license

      - name: Download PySide6 Android wheels
        run: |
          mkdir -p android-wheels
          cd android-wheels
          qtpip download PySide6 --android --arch aarch64
          qtpip download shiboken6 --android --arch aarch64

      - name: Prepare Android packaging configuration
        run: |
          PYSIDE_WHEEL="$(find android-wheels -type f -iname 'pyside6-*.whl' -print -quit)"
          SHIBOKEN_WHEEL="$(find android-wheels -type f -iname 'shiboken6-*.whl' -print -quit)"
          test -n "$PYSIDE_WHEEL" || { echo "PySide6 Android wheel not found"; exit 1; }
          test -n "$SHIBOKEN_WHEEL" || { echo "Shiboken6 Android wheel not found"; exit 1; }
          echo "PYSIDE_WHEEL=$PYSIDE_WHEEL" >> "$GITHUB_ENV"
          echo "SHIBOKEN_WHEEL=$SHIBOKEN_WHEEL" >> "$GITHUB_ENV"
          pyside6-android-deploy --init --force --keep-deployment-files \
            --name pawchivedownloader \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL"

      - name: Add internet permission
        run: python scripts/add_internet_permission.py

      - name: Build APK
        run: python -m buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PawchiveDownloader-APK
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 14
